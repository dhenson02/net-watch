[package]
name = "net-watch"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
aya = { workspace = true }
net-watch-common = { workspace = true, features = ["user"] }
anyhow = "1"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt", "macros", "time", "signal", "sync"] }
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
clickhouse = { version = "0.13", features = ["lz4"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"


[build-dependencies]
anyhow = "1"
aya-build = { workspace = true }
cargo_metadata = "0.23"
net-watch-ebpf = { path = "../net-watch-ebpf" }

# net-watch-ebpf is a build-dependency only so cargo rebuilds us when the
# eBPF sources change; the object itself is built by aya-build in build.rs.
[lints.cargo]
unused_dependencies = "allow"
