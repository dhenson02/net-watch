# Storage for net-watch. Both services use host networking (no docker-proxy /
# NAT hop on every write) and bind to 127.0.0.1 only. They are pinned to their
# own cores via NETWATCH_DB_CPUS so they never compete with the workloads being
# monitored; the collector itself pins to NETWATCH_CPUS (see .env.example).
name: netwatch

services:
  redis:
    image: redis:8-alpine
    network_mode: host
    cpuset: "${NETWATCH_DB_CPUS:-56-61}"
    command:
      - redis-server
      - --bind
      - 127.0.0.1
      - --port
      - "6379"
      - --save
      - ""
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - "${NETWATCH_REDIS_MAXMEMORY:-16gb}"
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    network_mode: host
    cpuset: "${NETWATCH_DB_CPUS:-56-61}"
    environment:
      CLICKHOUSE_USER: "${NETWATCH_CLICKHOUSE_USER:-netwatch}"
      CLICKHOUSE_PASSWORD: "${NETWATCH_CLICKHOUSE_PASSWORD:-netwatch}"
      CLICKHOUSE_DB: netwatch
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # Replaces the image's default, which listens on all interfaces.
      - ./clickhouse/config.d/docker_related_config.xml:/etc/clickhouse-server/config.d/docker_related_config.xml:ro
      - ./clickhouse/config.d/netwatch.xml:/etc/clickhouse-server/config.d/netwatch.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    cap_add:
      - SYS_NICE
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  redis-data:
  clickhouse-data:
